name: Upload playlist artwork

# Run by hand with a one-time SoundCloud sign-in code. The code is used
# once, so it is useless after this run.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "One-time code from the SoundCloud sign-in"
        required: true
      code_verifier:
        description: "PKCE verifier that matches the sign-in link"
        required: true
      playlist_id:
        description: "SoundCloud playlist id"
        required: true
      image:
        description: "Image path in this repo, e.g. artwork/daf/33-eirachin.jpg"
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload artwork to the playlist
        env:
          CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          VERIFIER: ${{ inputs.code_verifier }}
          PLAYLIST: ${{ inputs.playlist_id }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CODE"
          echo "::add-mask::$VERIFIER"
          test -f "$IMAGE" || { echo "Image not found: $IMAGE"; exit 1; }
          TOKEN_JSON=$(curl -sS -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=authorization_code -d "client_id=$CLIENT_ID" \
            --data-urlencode "redirect_uri=https://www.hashevaynu.org" \
            --data-urlencode "code=$CODE" --data-urlencode "code_verifier=$VERIFIER" \
            https://secure.soundcloud.com/oauth/token)
          TOKEN=$(echo "$TOKEN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "Sign-in code was not accepted: $(echo "$TOKEN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('error','unknown'))")"; exit 1; fi
          echo "::add-mask::$TOKEN"
          STATUS=$(curl -sS -o result.json -w '%{http_code}' -X PUT \
            -H "Authorization: OAuth $TOKEN" -H "Accept: application/json" \
            -F "playlist[artwork_data]=@$IMAGE" \
            "https://api.soundcloud.com/playlists/$PLAYLIST")
          echo "SoundCloud answered HTTP $STATUS"
          python3 -c "import json; d=json.load(open('result.json')); print('Playlist:', d.get('title')); print('Artwork:', d.get('artwork_url'))" || head -c 300 result.json
          [ "$STATUS" -lt 300 ]
